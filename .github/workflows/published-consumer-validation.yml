name: published-consumer-validation

on:
  workflow_call:
    inputs:
      consumer_id:
        description: Stable consumer identifier for certification ledger artifacts.
        required: false
        type: string
      consumer_tier:
        description: Consumer support tier, for example certified or proving.
        required: false
        type: string
      certification_scope:
        description: Ring enforcement scope, for example required or advisory.
        required: false
        type: string
      consumer_repository:
        description: External consumer repository to validate.
        required: false
        type: string
      consumer_ref:
        description: Ref to validate in the external consumer repository.
        required: false
        type: string
      target_path:
        description: Repository-relative VI path used to synthesize a temporary consumer target catalog during validation.
        required: false
        type: string
      compare_modes:
        description: Compare mode bundle to validate.
        required: false
        type: string
      max_pairs:
        description: Maximum adjacent commit pairs to process.
        required: false
        type: string
      max_signal_pairs:
        description: Maximum surfaced signal pairs.
        required: false
        type: string
      latest_immutable_tag:
        description: Optional immutable release tag to validate alongside v1.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      consumer_id:
        description: Stable consumer identifier for certification ledger artifacts.
        required: false
        default: ni-icon-editor
        type: string
      consumer_tier:
        description: Consumer support tier, for example certified or proving.
        required: false
        default: certified
        type: string
      certification_scope:
        description: Ring enforcement scope, for example required or advisory.
        required: false
        default: required
        type: string
      consumer_repository:
        description: External consumer repository to validate.
        required: false
        default: ni/labview-icon-editor
        type: string
      consumer_ref:
        description: Ref to validate in the external consumer repository.
        required: false
        default: develop
        type: string
      target_path:
        description: Repository-relative VI path used to synthesize a temporary consumer target catalog during validation.
        required: false
        default: Tooling/deployment/VIP_Post-Install Custom Action.vi
        type: string
      compare_modes:
        description: Compare mode bundle to validate.
        required: false
        default: attributes,front-panel,block-diagram
        type: string
      max_pairs:
        description: Maximum adjacent commit pairs to process.
        required: false
        default: '5'
        type: string
      max_signal_pairs:
        description: Maximum surfaced signal pairs.
        required: false
        default: '5'
        type: string
      latest_immutable_tag:
        description: Optional immutable release tag to validate alongside v1.
        required: false
        default: ''
        type: string
permissions:
  contents: read

concurrency:
  group: published-consumer-validation-${{ github.event_name }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      consumer_id: ${{ steps.defaults.outputs.consumer_id }}
      consumer_tier: ${{ steps.defaults.outputs.consumer_tier }}
      certification_scope: ${{ steps.defaults.outputs.certification_scope }}
      consumer_repository: ${{ steps.defaults.outputs.consumer_repository }}
      consumer_ref: ${{ steps.defaults.outputs.consumer_ref }}
      target_path: ${{ steps.defaults.outputs.target_path }}
      compare_modes: ${{ steps.defaults.outputs.compare_modes }}
      max_pairs: ${{ steps.defaults.outputs.max_pairs }}
      max_signal_pairs: ${{ steps.defaults.outputs.max_signal_pairs }}
      latest_immutable_tag: ${{ steps.refs.outputs.latest-immutable-tag }}
    steps:
      - name: Checkout comparevi-history repo
        uses: actions/checkout@v5

      - name: Resolve consumer defaults
        id: defaults
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $consumerId = '${{ inputs.consumer_id }}'
          if ([string]::IsNullOrWhiteSpace($consumerId)) {
            $consumerId = ('${{ inputs.consumer_repository }}' -replace '[^A-Za-z0-9]+', '-').Trim('-').ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($consumerId)) {
              $consumerId = 'consumer'
            }
          }

          $consumerTier = '${{ inputs.consumer_tier }}'
          if ([string]::IsNullOrWhiteSpace($consumerTier)) {
            $consumerTier = 'certified'
          }

          $certificationScope = '${{ inputs.certification_scope }}'
          if ([string]::IsNullOrWhiteSpace($certificationScope)) {
            $certificationScope = 'required'
          }

          $consumerRepository = '${{ inputs.consumer_repository }}'
          if ([string]::IsNullOrWhiteSpace($consumerRepository)) {
            $consumerRepository = 'ni/labview-icon-editor'
          }

          $consumerRef = '${{ inputs.consumer_ref }}'
          if ([string]::IsNullOrWhiteSpace($consumerRef)) {
            $consumerRef = 'develop'
          }

          $targetPath = '${{ inputs.target_path }}'
          if ([string]::IsNullOrWhiteSpace($targetPath)) {
            $targetPath = 'Tooling/deployment/VIP_Post-Install Custom Action.vi'
          }

          $compareModes = '${{ inputs.compare_modes }}'
          if ([string]::IsNullOrWhiteSpace($compareModes)) {
            $compareModes = 'attributes,front-panel,block-diagram'
          }

          $maxPairs = '${{ inputs.max_pairs }}'
          if ([string]::IsNullOrWhiteSpace($maxPairs)) {
            $maxPairs = '5'
          }

          $maxSignalPairs = '${{ inputs.max_signal_pairs }}'
          if ([string]::IsNullOrWhiteSpace($maxSignalPairs)) {
            $maxSignalPairs = '5'
          }

          @(
            "consumer_id=$consumerId"
            "consumer_tier=$consumerTier"
            "certification_scope=$certificationScope"
            "consumer_repository=$consumerRepository"
            "consumer_ref=$consumerRef"
            "target_path=$targetPath"
            "compare_modes=$compareModes"
            "max_pairs=$maxPairs"
            "max_signal_pairs=$maxSignalPairs"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve published facade refs
        id: refs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & "$PWD/scripts/Resolve-CompareVIHistoryPublishedRefs.ps1" `
            -Repository 'LabVIEW-Community-CI-CD/comparevi-history' `
            -MajorTag 'v1' `
            -LatestImmutableTag '${{ inputs.latest_immutable_tag }}' `
            -GitHubToken $env:GITHUB_TOKEN `
            -GitHubOutputPath $env:GITHUB_OUTPUT `
            -StepSummaryPath $env:GITHUB_STEP_SUMMARY | Out-Null

  validate-major:
    name: published-consumer-major
    needs: plan
    runs-on: windows-latest
    outputs:
      certification_status: ${{ steps.major_status.outputs.result }}
    steps:
      - name: Checkout comparevi-history validation repo
        uses: actions/checkout@v5
        with:
          path: validation-support

      - name: Checkout published major facade ref
        uses: actions/checkout@v5
        with:
          repository: LabVIEW-Community-CI-CD/comparevi-history
          ref: v1
          path: published-facade
          fetch-depth: 1

      - name: Checkout external consumer repo
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.plan.outputs.consumer_repository }}
          ref: ${{ needs.plan.outputs.consumer_ref }}
          path: labview-icon-editor
          fetch-depth: 0

      - name: Write LVCompare stub
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $stubPath = Join-Path $env:GITHUB_WORKSPACE 'labview-icon-editor/tests/results/_comparevi-history-published/major/Invoke-LVCompare.stub.ps1'
          & "$env:GITHUB_WORKSPACE/validation-support/scripts/Write-CompareVIHistorySmokeStub.ps1" -DestinationPath $stubPath

      - name: Write consumer target catalog
        shell: pwsh
        env:
          TARGET_PATH: ${{ needs.plan.outputs.target_path }}
          COMPARE_MODES: ${{ needs.plan.outputs.compare_modes }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $targetCatalogPath = Join-Path $env:GITHUB_WORKSPACE 'labview-icon-editor/.github/comparevi-history-targets.json'
          New-Item -ItemType Directory -Path (Split-Path -Parent $targetCatalogPath) -Force | Out-Null
          $modes = @(
            $env:COMPARE_MODES -split '[,;]' |
              ForEach-Object { $_.Trim().ToLowerInvariant() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          $catalog = [ordered]@{
            schema = 'comparevi-history/consumer-targets@v1'
            defaultTargetId = 'published-consumer-target'
            targets = @(
              [ordered]@{
                id = 'published-consumer-target'
                path = $env:TARGET_PATH
                publicModes = $modes
                reviewerSurface = [ordered]@{
                  variants = @('manual')
                }
              }
            )
          }
          $catalog | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $targetCatalogPath -Encoding utf8

      - name: Run comparevi-history major facade
        id: history
        continue-on-error: ${{ needs.plan.outputs.certification_scope == 'advisory' }}
        uses: ./published-facade
        with:
          repository_root: labview-icon-editor
          target_spec_path: .github/comparevi-history-targets.json
          target_id: published-consumer-target
          start_ref: HEAD
          max_pairs: ${{ needs.plan.outputs.max_pairs }}
          max_signal_pairs: ${{ needs.plan.outputs.max_signal_pairs }}
          mode: ${{ needs.plan.outputs.compare_modes }}
          results_dir: tests/results/_comparevi-history-published/major/history
          detailed: true
          render_report: true
          reviewer_surface: manual
          reviewer_pull_request_number: published-major-${{ github.run_id }}
          reviewer_is_fork: false
          container_image: stubbed-windows-smoke
          invoke_script_path: tests/results/_comparevi-history-published/major/Invoke-LVCompare.stub.ps1

      - name: Assert major published consumer outputs
        id: assert_major
        continue-on-error: ${{ needs.plan.outputs.certification_scope == 'advisory' }}
        shell: pwsh
        env:
          ACTION_REF: LabVIEW-Community-CI-CD/comparevi-history@v1
          CONSUMER_REPOSITORY: ${{ needs.plan.outputs.consumer_repository }}
          CONSUMER_REF: ${{ needs.plan.outputs.consumer_ref }}
          TARGET_PATH: ${{ needs.plan.outputs.target_path }}
          EXPECTED_MODE_LIST: ${{ needs.plan.outputs.compare_modes }}
          MANIFEST_PATH: ${{ steps.history.outputs['manifest-path'] }}
          RESULTS_DIR: ${{ steps.history.outputs['results-dir'] }}
          MODE_COUNT: ${{ steps.history.outputs['mode-count'] }}
          MODE_LIST: ${{ steps.history.outputs['mode-list'] }}
          REQUESTED_MODE_LIST: ${{ steps.history.outputs['requested-mode-list'] }}
          EXECUTED_MODE_LIST: ${{ steps.history.outputs['executed-mode-list'] }}
          MODE_MANIFESTS_JSON: ${{ steps.history.outputs['mode-manifests-json'] }}
          HISTORY_SUMMARY_JSON: ${{ steps.history.outputs['history-summary-json'] }}
          HISTORY_REPORT_MD: ${{ steps.history.outputs['history-report-md'] }}
          HISTORY_REPORT_HTML: ${{ steps.history.outputs['history-report-html'] }}
          TOTAL_PROCESSED: ${{ steps.history.outputs['total-processed'] }}
          TOTAL_DIFFS: ${{ steps.history.outputs['total-diffs'] }}
          STOP_REASON: ${{ steps.history.outputs['stop-reason'] }}
          REQUEST_PATH: ${{ steps.history.outputs['request-path'] }}
          PUBLIC_RUN_PATH: ${{ steps.history.outputs['public-run-path'] }}
          SHARED_EVIDENCE_PATH: ${{ steps.history.outputs['shared-evidence-path'] }}
          PUBLIC_COMMENT_PATH: ${{ steps.history.outputs['public-comment-path'] }}
          PUBLIC_STEP_SUMMARY_PATH: ${{ steps.history.outputs['public-step-summary-path'] }}
          FINAL_STATUS: ${{ steps.history.outputs['final-status'] }}
          FINAL_REASON: ${{ steps.history.outputs['final-reason'] }}
          ARTIFACT_NAME: comparevi-history-published-major-${{ needs.plan.outputs.consumer_id }}-${{ github.run_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & "$env:GITHUB_WORKSPACE/validation-support/scripts/Assert-CompareVIHistoryPublishedRun.ps1" `
            -ActionRef $env:ACTION_REF `
            -ConsumerRepository $env:CONSUMER_REPOSITORY `
            -ConsumerRef $env:CONSUMER_REF `
            -TargetPath $env:TARGET_PATH `
            -ExpectedModeList $env:EXPECTED_MODE_LIST `
            -ManifestPath $env:MANIFEST_PATH `
            -ResultsDir $env:RESULTS_DIR `
            -ModeCount $env:MODE_COUNT `
            -ModeList $env:MODE_LIST `
            -RequestedModeList $env:REQUESTED_MODE_LIST `
            -ExecutedModeList $env:EXECUTED_MODE_LIST `
            -ModeManifestsJson $env:MODE_MANIFESTS_JSON `
            -HistorySummaryJson $env:HISTORY_SUMMARY_JSON `
            -HistoryReportMd $env:HISTORY_REPORT_MD `
            -HistoryReportHtml $env:HISTORY_REPORT_HTML `
            -TotalProcessed $env:TOTAL_PROCESSED `
            -TotalDiffs $env:TOTAL_DIFFS `
            -StopReason $env:STOP_REASON `
            -RequestPath $env:REQUEST_PATH `
            -PublicRunPath $env:PUBLIC_RUN_PATH `
            -SharedEvidencePath $env:SHARED_EVIDENCE_PATH `
            -PublicCommentPath $env:PUBLIC_COMMENT_PATH `
            -PublicStepSummaryPath $env:PUBLIC_STEP_SUMMARY_PATH `
            -FinalStatus $env:FINAL_STATUS `
            -FinalReason $env:FINAL_REASON `
            -ArtifactName $env:ARTIFACT_NAME `
            -EvidencePath 'labview-icon-editor/tests/results/_comparevi-history-published/major/published-evidence.json' `
            -StepSummaryPath $env:GITHUB_STEP_SUMMARY | Out-Null

      - name: Upload major published consumer artifacts
        if: ${{ steps.history.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: comparevi-history-published-major-${{ needs.plan.outputs.consumer_id }}-${{ github.run_id }}
          path: |
            ${{ steps.history.outputs['results-dir'] }}/**
            labview-icon-editor/tests/results/_comparevi-history-published/major/published-evidence.json
          if-no-files-found: error

      - name: Compute major certification status
        id: major_status
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          history_outcome='${{ steps.history.outcome }}'
          assert_outcome='${{ steps.assert_major.outcome }}'
          if [ "$history_outcome" = "success" ] && [ "$assert_outcome" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

  validate-immutable:
    name: published-consumer-immutable
    needs: plan
    runs-on: windows-latest
    outputs:
      certification_status: ${{ steps.immutable_status.outputs.result }}
    steps:
      - name: Checkout comparevi-history validation repo
        uses: actions/checkout@v5
        with:
          path: validation-support

      - name: Checkout published immutable facade ref
        uses: actions/checkout@v5
        with:
          repository: LabVIEW-Community-CI-CD/comparevi-history
          ref: ${{ needs.plan.outputs.latest_immutable_tag }}
          path: published-facade
          fetch-depth: 1

      - name: Checkout external consumer repo
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.plan.outputs.consumer_repository }}
          ref: ${{ needs.plan.outputs.consumer_ref }}
          path: labview-icon-editor
          fetch-depth: 0

      - name: Write LVCompare stub
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $stubPath = Join-Path $env:GITHUB_WORKSPACE 'labview-icon-editor/tests/results/_comparevi-history-published/immutable/Invoke-LVCompare.stub.ps1'
          & "$env:GITHUB_WORKSPACE/validation-support/scripts/Write-CompareVIHistorySmokeStub.ps1" -DestinationPath $stubPath

      - name: Write consumer target catalog
        shell: pwsh
        env:
          TARGET_PATH: ${{ needs.plan.outputs.target_path }}
          COMPARE_MODES: ${{ needs.plan.outputs.compare_modes }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $targetCatalogPath = Join-Path $env:GITHUB_WORKSPACE 'labview-icon-editor/.github/comparevi-history-targets.json'
          New-Item -ItemType Directory -Path (Split-Path -Parent $targetCatalogPath) -Force | Out-Null
          $modes = @(
            $env:COMPARE_MODES -split '[,;]' |
              ForEach-Object { $_.Trim().ToLowerInvariant() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          $catalog = [ordered]@{
            schema = 'comparevi-history/consumer-targets@v1'
            defaultTargetId = 'published-consumer-target'
            targets = @(
              [ordered]@{
                id = 'published-consumer-target'
                path = $env:TARGET_PATH
                publicModes = $modes
                reviewerSurface = [ordered]@{
                  variants = @('manual')
                }
              }
            )
          }
          $catalog | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $targetCatalogPath -Encoding utf8

      - name: Run comparevi-history immutable facade
        id: history
        continue-on-error: ${{ needs.plan.outputs.certification_scope == 'advisory' }}
        uses: ./published-facade
        with:
          repository_root: labview-icon-editor
          target_spec_path: .github/comparevi-history-targets.json
          target_id: published-consumer-target
          start_ref: HEAD
          max_pairs: ${{ needs.plan.outputs.max_pairs }}
          max_signal_pairs: ${{ needs.plan.outputs.max_signal_pairs }}
          mode: ${{ needs.plan.outputs.compare_modes }}
          results_dir: tests/results/_comparevi-history-published/immutable/history
          detailed: true
          render_report: true
          reviewer_surface: manual
          reviewer_pull_request_number: published-immutable-${{ github.run_id }}
          reviewer_is_fork: false
          container_image: stubbed-windows-smoke
          invoke_script_path: tests/results/_comparevi-history-published/immutable/Invoke-LVCompare.stub.ps1

      - name: Assert immutable published consumer outputs
        id: assert_immutable
        continue-on-error: ${{ needs.plan.outputs.certification_scope == 'advisory' }}
        shell: pwsh
        env:
          ACTION_REF: LabVIEW-Community-CI-CD/comparevi-history@${{ needs.plan.outputs.latest_immutable_tag }}
          CONSUMER_REPOSITORY: ${{ needs.plan.outputs.consumer_repository }}
          CONSUMER_REF: ${{ needs.plan.outputs.consumer_ref }}
          TARGET_PATH: ${{ needs.plan.outputs.target_path }}
          EXPECTED_MODE_LIST: ${{ needs.plan.outputs.compare_modes }}
          MANIFEST_PATH: ${{ steps.history.outputs['manifest-path'] }}
          RESULTS_DIR: ${{ steps.history.outputs['results-dir'] }}
          MODE_COUNT: ${{ steps.history.outputs['mode-count'] }}
          MODE_LIST: ${{ steps.history.outputs['mode-list'] }}
          REQUESTED_MODE_LIST: ${{ steps.history.outputs['requested-mode-list'] }}
          EXECUTED_MODE_LIST: ${{ steps.history.outputs['executed-mode-list'] }}
          MODE_MANIFESTS_JSON: ${{ steps.history.outputs['mode-manifests-json'] }}
          HISTORY_SUMMARY_JSON: ${{ steps.history.outputs['history-summary-json'] }}
          HISTORY_REPORT_MD: ${{ steps.history.outputs['history-report-md'] }}
          HISTORY_REPORT_HTML: ${{ steps.history.outputs['history-report-html'] }}
          TOTAL_PROCESSED: ${{ steps.history.outputs['total-processed'] }}
          TOTAL_DIFFS: ${{ steps.history.outputs['total-diffs'] }}
          STOP_REASON: ${{ steps.history.outputs['stop-reason'] }}
          REQUEST_PATH: ${{ steps.history.outputs['request-path'] }}
          PUBLIC_RUN_PATH: ${{ steps.history.outputs['public-run-path'] }}
          SHARED_EVIDENCE_PATH: ${{ steps.history.outputs['shared-evidence-path'] }}
          PUBLIC_COMMENT_PATH: ${{ steps.history.outputs['public-comment-path'] }}
          PUBLIC_STEP_SUMMARY_PATH: ${{ steps.history.outputs['public-step-summary-path'] }}
          FINAL_STATUS: ${{ steps.history.outputs['final-status'] }}
          FINAL_REASON: ${{ steps.history.outputs['final-reason'] }}
          ARTIFACT_NAME: comparevi-history-published-immutable-${{ needs.plan.outputs.consumer_id }}-${{ github.run_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          & "$env:GITHUB_WORKSPACE/validation-support/scripts/Assert-CompareVIHistoryPublishedRun.ps1" `
            -ActionRef $env:ACTION_REF `
            -ConsumerRepository $env:CONSUMER_REPOSITORY `
            -ConsumerRef $env:CONSUMER_REF `
            -TargetPath $env:TARGET_PATH `
            -ExpectedModeList $env:EXPECTED_MODE_LIST `
            -ManifestPath $env:MANIFEST_PATH `
            -ResultsDir $env:RESULTS_DIR `
            -ModeCount $env:MODE_COUNT `
            -ModeList $env:MODE_LIST `
            -RequestedModeList $env:REQUESTED_MODE_LIST `
            -ExecutedModeList $env:EXECUTED_MODE_LIST `
            -ModeManifestsJson $env:MODE_MANIFESTS_JSON `
            -HistorySummaryJson $env:HISTORY_SUMMARY_JSON `
            -HistoryReportMd $env:HISTORY_REPORT_MD `
            -HistoryReportHtml $env:HISTORY_REPORT_HTML `
            -TotalProcessed $env:TOTAL_PROCESSED `
            -TotalDiffs $env:TOTAL_DIFFS `
            -StopReason $env:STOP_REASON `
            -RequestPath $env:REQUEST_PATH `
            -PublicRunPath $env:PUBLIC_RUN_PATH `
            -SharedEvidencePath $env:SHARED_EVIDENCE_PATH `
            -PublicCommentPath $env:PUBLIC_COMMENT_PATH `
            -PublicStepSummaryPath $env:PUBLIC_STEP_SUMMARY_PATH `
            -FinalStatus $env:FINAL_STATUS `
            -FinalReason $env:FINAL_REASON `
            -ArtifactName $env:ARTIFACT_NAME `
            -EvidencePath 'labview-icon-editor/tests/results/_comparevi-history-published/immutable/published-evidence.json' `
            -StepSummaryPath $env:GITHUB_STEP_SUMMARY | Out-Null

      - name: Upload immutable published consumer artifacts
        if: ${{ steps.history.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: comparevi-history-published-immutable-${{ needs.plan.outputs.consumer_id }}-${{ github.run_id }}
          path: |
            ${{ steps.history.outputs['results-dir'] }}/**
            labview-icon-editor/tests/results/_comparevi-history-published/immutable/published-evidence.json
          if-no-files-found: error

      - name: Compute immutable certification status
        id: immutable_status
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          history_outcome='${{ steps.history.outcome }}'
          assert_outcome='${{ steps.assert_immutable.outcome }}'
          if [ "$history_outcome" = "success" ] && [ "$assert_outcome" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

  certification-ledger:
    name: certification-ledger
    if: ${{ always() }}
    needs:
      - plan
      - validate-major
      - validate-immutable
    runs-on: ubuntu-latest
    steps:
      - name: Write certification ledger receipt
        shell: bash
        env:
          CONSUMER_ID: ${{ needs.plan.outputs.consumer_id }}
          CONSUMER_TIER: ${{ needs.plan.outputs.consumer_tier }}
          CERTIFICATION_SCOPE: ${{ needs.plan.outputs.certification_scope }}
          CONSUMER_REPOSITORY: ${{ needs.plan.outputs.consumer_repository }}
          CONSUMER_REF: ${{ needs.plan.outputs.consumer_ref }}
          TARGET_PATH: ${{ needs.plan.outputs.target_path }}
          COMPARE_MODES: ${{ needs.plan.outputs.compare_modes }}
          MAX_PAIRS: ${{ needs.plan.outputs.max_pairs }}
          MAX_SIGNAL_PAIRS: ${{ needs.plan.outputs.max_signal_pairs }}
          LATEST_IMMUTABLE_TAG: ${{ needs.plan.outputs.latest_immutable_tag }}
          MAJOR_RESULT: ${{ needs.validate-major.outputs.certification_status }}
          IMMUTABLE_RESULT: ${{ needs.validate-immutable.outputs.certification_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT_PATH: tests/results/certification/${{ needs.plan.outputs.consumer_id }}-certification-ledger.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const majorResult = process.env.MAJOR_RESULT || 'unknown';
          const immutableResult = process.env.IMMUTABLE_RESULT || 'unknown';
          const overallStatus = majorResult === 'pass' && immutableResult === 'pass' ? 'pass' : 'fail';
          const payload = {
            schema: 'comparevi-history/consumer-certification-ledger@v1',
            generatedAt: new Date().toISOString(),
            platform: {
              repository: process.env.GITHUB_REPOSITORY,
              ref: process.env.GITHUB_REF_NAME || null,
              runUrl: process.env.RUN_URL,
              latestImmutableTag: process.env.LATEST_IMMUTABLE_TAG || null
            },
            consumer: {
              id: process.env.CONSUMER_ID,
              repository: process.env.CONSUMER_REPOSITORY,
              ref: process.env.CONSUMER_REF,
              tier: process.env.CONSUMER_TIER,
              scope: process.env.CERTIFICATION_SCOPE,
              targetPath: process.env.TARGET_PATH,
              compareModes: process.env.COMPARE_MODES,
              maxPairs: process.env.MAX_PAIRS,
              maxSignalPairs: process.env.MAX_SIGNAL_PAIRS
            },
            certification: {
              status: overallStatus,
              movingMajorTag: {
                ref: 'v1',
                result: majorResult
              },
              immutableTag: {
                ref: process.env.LATEST_IMMUTABLE_TAG || null,
                result: immutableResult
              }
            }
          };
          const outputPath = path.resolve(process.env.OUTPUT_PATH);
          fs.mkdirSync(path.dirname(outputPath), { recursive: true });
          fs.writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`, 'utf8');
          NODE

      - name: Upload certification ledger receipt
        uses: actions/upload-artifact@v5
        with:
          name: comparevi-history-certification-ledger-${{ needs.plan.outputs.consumer_id }}-${{ github.run_id }}
          path: tests/results/certification/${{ needs.plan.outputs.consumer_id }}-certification-ledger.json
          if-no-files-found: error

      - name: Append certification ledger summary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('tests/results/certification/${{ needs.plan.outputs.consumer_id }}-certification-ledger.json', 'utf8'));
          const lines = [
            '## Consumer Certification Ledger',
            `- consumer: \`${report.consumer.repository}@${report.consumer.ref}\``,
            `- tier: \`${report.consumer.tier}\``,
            `- scope: \`${report.consumer.scope}\``,
            `- status: \`${report.certification.status}\``,
            `- moving major tag (\`v1\`): \`${report.certification.movingMajorTag.result}\``,
            `- immutable tag (\`${report.certification.immutableTag.ref || 'none'}\`): \`${report.certification.immutableTag.result}\``
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`, 'utf8');
          NODE
